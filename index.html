<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebCode</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand"><div class="logo">&lt;/&gt;</div><div><b>WebCode</b><small>Éditeur web</small></div></div><nav><button id="newBtn">Nouveau</button><button id="importBtn">Importer</button><button id="downloadBtn">Télécharger</button><button id="zipBtn">Projet ZIP</button><button id="previewBtn" class="primary">▶ Preview</button></nav></header>
<main class="workspace"><aside class="sidebar"><div class="sidehead"><div><b>Fichiers</b><small id="count">0 fichier</small></div><div><button id="newFile" title="Nouveau fichier">+</button><button id="newFolder" title="Nouveau dossier">📁</button></div></div><div id="tree" class="tree"></div></aside>
<section class="editor"><div class="tab"><span id="fileIcon"></span><span id="fileName">Aucun fichier</span></div><div class="editorbody"><div id="lines">1</div><textarea id="code" spellcheck="false" wrap="off" disabled></textarea><div id="binary" class="binary hidden"><b id="binaryName"></b><span>Fichier binaire</span></div></div><footer><span id="cursor">Ln 1, Col 1</span><span id="lang">Plain Text</span><span id="size">0 B</span></footer></section>
<section class="preview"><div class="previewhead"><b>● Preview</b><div><button id="refresh">↻</button><button id="open">↗</button></div></div><div class="address" id="address">preview://vide</div><div class="devices"><button class="device active" data-device="desktop">Desktop</button><button class="device" data-device="tablet">Tablet</button><button class="device" data-device="mobile">Mobile</button></div><div id="stage" class="stage"><iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></div></section></main>
<div id="modal" class="modal hidden"><div class="card"><div class="modalhead"><div><h2 id="modalTitle"></h2><p id="modalText"></p></div><button id="modalClose">×</button></div><label id="modalLabel">Nom</label><input id="modalInput" autocomplete="off"><div id="modalError"></div><div class="actions"><button id="modalCancel">Annuler</button><button id="modalOk" class="primary">Valider</button></div></div></div>
<div id="confirm" class="modal hidden"><div class="card small"><div class="modalhead"><div><h2 id="confirmTitle">Confirmer</h2><p id="confirmText"></p></div><button id="confirmClose">×</button></div><div class="actions"><button id="confirmCancel">Annuler</button><button id="confirmOk" class="danger">Confirmer</button></div></div></div>
<div id="context" class="context hidden"><button data-a="open">Ouvrir</button><button data-a="rename">Renommer</button><button data-a="duplicate">Dupliquer</button><hr><button data-a="delete" class="danger-text">Supprimer</button></div>
<div id="search" class="search hidden"><input id="searchInput" placeholder="Rechercher…"><span id="searchCount">0</span><button id="searchClose">×</button></div>
<input id="fileInput" type="file" multiple hidden><div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="script.js"></script></body></html>
