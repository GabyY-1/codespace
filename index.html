<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Un espace de code pour vous !">
    <title>CodeSpace GBRXV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">&lt;/&gt;</div>
            <div>
                <strong>WebCode</strong>
                <span>Éditeur web</span>
            </div>
        </div>

        <div class="toolbar">
            <button id="newProjectBtn" class="tool-btn" type="button">Nouveau</button>
            <button id="importBtn" class="tool-btn" type="button">Importer</button>
            <button id="downloadFileBtn" class="tool-btn" type="button">Télécharger</button>
            <button id="downloadProjectBtn" class="tool-btn" type="button">Projet ZIP</button>
            <button id="previewBtn" class="tool-btn primary" type="button">▶ Preview</button>
        </div>
    </header>

    <main class="workspace">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div>
                    <div class="panel-title">Fichiers</div>
                    <div id="fileCount" class="panel-subtitle">0 fichier</div>
                </div>
                <div class="mini-actions">
                    <button id="addFileBtn" type="button" title="Nouveau fichier">+</button>
                    <button id="addFolderBtn" type="button" title="Nouveau dossier">📁</button>
                </div>
            </div>

            <div id="fileTree" class="file-tree"></div>

            <div class="sidebar-bottom">
                <button id="collapseBtn" type="button">Réduire les dossiers</button>
            </div>
        </aside>

        <section class="editor-panel">
            <div class="editor-head">
                <div class="file-tab">
                    <span id="fileIcon" class="file-icon">HTML</span>
                    <span id="activeFileName">index.html</span>
                    <span id="dirtyDot" class="dirty-dot hidden">●</span>
                </div>

                <div class="editor-tools">
                    <button id="findBtn" type="button" title="Rechercher">⌕</button>
                    <button id="formatBtn" type="button" title="Formatage simple">⟲</button>
                </div>
            </div>

            <div class="editor-wrap">
                <div id="lineNumbers" class="line-numbers">1</div>
                <textarea id="codeEditor" class="code-editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Éditeur de code"></textarea>
            </div>

            <div class="statusbar">
                <span id="cursorInfo">Ln 1, Col 1</span>
                <span id="languageInfo">HTML</span>
                <span id="sizeInfo">0 B</span>
            </div>
        </section>

        <section class="preview-panel">
            <div class="preview-head">
                <div class="preview-label">
                    <span class="live-dot"></span>
                    <span>Preview</span>
                    <span id="previewFileName" class="muted">index.html</span>
                </div>

                <div class="preview-actions">
                    <button id="refreshPreviewBtn" type="button" title="Actualiser">↻</button>
                    <button id="openPreviewBtn" type="button" title="Nouvel onglet">↗</button>
                </div>
            </div>

            <div class="preview-address">
                <span>●</span>
                <span id="previewAddress">preview://index.html</span>
            </div>

            <div class="device-bar">
                <button class="device active" data-device="desktop" type="button">Desktop</button>
                <button class="device" data-device="tablet" type="button">Tablet</button>
                <button class="device" data-device="mobile" type="button">Mobile</button>
            </div>

            <div id="previewStage" class="preview-stage">
                <iframe id="previewFrame" title="Aperçu du site" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
            </div>
        </section>
    </main>

    <div id="searchBox" class="floating-search hidden">
        <input id="searchInput" type="text" placeholder="Rechercher dans le fichier…">
        <span id="searchResult">0 résultat</span>
        <button id="closeSearchBtn" type="button">×</button>
    </div>

    <div id="contextMenu" class="context-menu hidden">
        <button data-action="open" type="button">Ouvrir</button>
        <button data-action="rename" type="button">Renommer</button>
        <button data-action="duplicate" type="button">Dupliquer</button>
        <div class="menu-line"></div>
        <button data-action="delete" class="danger" type="button">Supprimer</button>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-card">
            <div class="modal-head">
                <div>
                    <h2 id="modalTitle">Nouveau fichier</h2>
                    <p id="modalText">Créer un élément.</p>
                </div>
                <button id="modalCloseBtn" type="button">×</button>
            </div>

            <label id="modalLabel" for="modalInput">Nom</label>
            <input id="modalInput" type="text" autocomplete="off" spellcheck="false">
            <div id="modalError" class="modal-error"></div>

            <div class="modal-actions">
                <button id="modalCancelBtn" type="button">Annuler</button>
                <button id="modalConfirmBtn" class="primary" type="button">Valider</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal hidden">
        <div class="modal-card small">
            <div class="modal-head">
                <div>
                    <h2 id="confirmTitle">Confirmer</h2>
                    <p id="confirmText">Cette action est définitive.</p>
                </div>
                <button id="confirmCloseBtn" type="button">×</button>
            </div>

            <div class="modal-actions">
                <button id="confirmCancelBtn" type="button">Annuler</button>
                <button id="confirmOkBtn" class="danger-btn" type="button">Supprimer</button>
            </div>
        </div>
    </div>

    <input id="fileInput" type="file" multiple hidden>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
